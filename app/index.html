<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A12" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BDE Sorbonne" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap"
      rel="stylesheet"
    />

    <title>BDE IAE Paris Sorbonne</title>
    <meta
      name="description"
      content="Le site officiel du Bureau des Étudiants de l'IAE Paris Sorbonne : événements, soirées, sport, sorties et réductions étudiantes négociées avec nos partenaires."
    />
    <!-- Pas de <link rel="canonical"> ici : c'est le Worker qui le pose,
         avec l'adresse réelle de la page. Écrit en dur, il vaudrait
         « accueil » sur toutes les pages du site et les ferait toutes
         sortir de l'index comme doublons. -->

    <!-- Open Graph : ce qui s'affiche quand le lien est partagé sur
         Instagram, WhatsApp, LinkedIn... ou envoyé à un partenaire. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BDE IAE Paris Sorbonne" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://bdeiaeparis.com/" />
    <meta property="og:title" content="BDE IAE Paris Sorbonne" />
    <meta
      property="og:description"
      content="Événements, soirées, sport, sorties et réductions étudiantes négociées avec nos partenaires."
    />
    <meta property="og:image" content="https://bdeiaeparis.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BDE IAE Paris Sorbonne" />
    <meta
      name="twitter:description"
      content="Événements, soirées, sport, sorties et réductions étudiantes négociées avec nos partenaires."
    />
    <meta name="twitter:image" content="https://bdeiaeparis.com/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "BDE IAE Paris Sorbonne",
        "alternateName": "Nouveau Bureau des Étudiants de l'IAE Paris",
        "url": "https://bdeiaeparis.com/",
        "logo": "https://bdeiaeparis.com/pwa-512.png",
        "sameAs": ["https://www.instagram.com/bde.iaeparissorbonne"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
